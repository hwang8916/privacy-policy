<!DOCTYPE html>
<html lang="ko">
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(160deg, #fdeef6 0%, #f6e6f2 45%, #fbf3f9 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; color: #2b1d27;
    }
    .container {
      width: 100%; max-width: 760px; background: rgba(255, 255, 255, 0.94);
      border: 1px solid #f0d9e8; border-radius: 24px; padding: 36px;
      box-shadow: 0 22px 50px rgba(186, 46, 128, 0.14); backdrop-filter: blur(12px);
    }
    .eyebrow {
      display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 999px;
      background: #fbe4f1; color: #d6489a; font-size: 13px; font-weight: 700; margin-bottom: 14px;
    }
    h1 { font-size: 34px; line-height: 1.2; margin-bottom: 12px; }
    .subtitle { color: #7a6070; font-size: 15px; line-height: 1.7; margin-bottom: 28px; }
    .docs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .doc-card {
      display: block; text-decoration: none; color: inherit; padding: 24px 22px;
      border-radius: 18px; border: 1px solid #f0d9e8;
      background: linear-gradient(180deg, #ffffff 0%, #fef6fb 100%);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .doc-card:hover {
      transform: translateY(-3px); border-color: #ef9cc9;
      box-shadow: 0 14px 28px rgba(214, 72, 154, 0.12);
    }
    .doc-icon { font-size: 28px; margin-bottom: 14px; }
    .doc-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .doc-desc { font-size: 14px; line-height: 1.6; color: #8a6d7e; }
    .home-link { display: inline-block; margin-top: 26px; color: #d6489a; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">Pixel Sudoku Documents</div>

    <div class="docs">
      <a class="doc-card" href="privacy-policy.html">
        <div class="doc-icon">🔒</div>
        <div class="doc-title">개인정보 처리방침</div>

      </a>

      <a class="doc-card" href="terms-of-service.html">
        <div class="doc-icon">📘</div>
        <div class="doc-title">이용약관</div>
        <div class="doc-desc">서비스 이용 조건, 인앱 결제·가상 재화, 광고, 책임 제한과 문의처를 확인합니다.</div>
      </a>
    </div>

    <a class="home-link" href="../index.html">메인으로 돌아가기</a>
  </div>
</body>
</html>
