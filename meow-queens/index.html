<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="냥퀸즈(Meow Queens) 개인정보 처리방침과 계정 삭제 안내">
  <title>냥퀸즈 문서 센터</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(160deg, #fff1e7 0%, #fdebf4 50%, #f5efff 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; color: #563f3a;
    }
    .container {
      width: 100%; max-width: 760px; background: rgba(255, 255, 255, 0.95);
      border: 1px solid #f0d9df; border-radius: 24px; padding: 36px;
      box-shadow: 0 22px 50px rgba(179, 83, 119, 0.14); backdrop-filter: blur(12px);
    }
    .eyebrow {
      display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 999px;
      background: #ffe6ef; color: #d45183; font-size: 13px; font-weight: 700; margin-bottom: 14px;
    }
    h1 { font-size: 34px; line-height: 1.2; margin-bottom: 12px; }
    .subtitle { color: #7a625d; font-size: 15px; line-height: 1.7; margin-bottom: 28px; }
    .docs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .doc-card {
      display: block; text-decoration: none; color: inherit; padding: 24px 22px;
      border-radius: 18px; border: 1px solid #f0d9df;
      background: linear-gradient(180deg, #ffffff 0%, #fff8fb 100%);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .doc-card:hover { transform: translateY(-3px); border-color: #ee9aba; box-shadow: 0 14px 28px rgba(212, 81, 131, 0.12); }
    .doc-icon { font-size: 28px; margin-bottom: 14px; }
    .doc-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .doc-desc { font-size: 14px; line-height: 1.6; color: #866d67; }
    .home-link { display: inline-block; margin-top: 26px; color: #d45183; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">Meow Queens Documents</div>
    <h1>냥퀸즈 문서 센터</h1>
    <p class="subtitle">냥퀸즈의 Firebase 익명 계정, 순위 데이터, 기기 내 저장 정보와 Google Mobile Ads 처리 기준을 한국어, 영어, 일본어로 안내합니다.</p>

    <div class="docs">
      <a class="doc-card" href="privacy-policy.html">
        <div class="doc-icon">🔒</div>
        <div class="doc-title">개인정보 처리방침</div>
        <div class="doc-desc">수집 정보, 이용 목적, 광고·Firebase 처리, 보관 기간과 이용자 권리를 확인합니다.</div>
      </a>
      <a class="doc-card" href="privacy-policy.html#delete-account">
        <div class="doc-icon">🗑️</div>
        <div class="doc-title">계정 및 데이터 삭제</div>
        <div class="doc-desc">앱을 설치하지 않은 상태에서도 익명 계정과 연결 데이터 삭제를 요청할 수 있습니다.</div>
      </a>
    </div>

    <a class="home-link" href="../index.html">메인으로 돌아가기</a>
  </div>
</body>
</html>
